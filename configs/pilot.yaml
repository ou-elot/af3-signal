# Freeze this configuration before inference. Changed configurations need a new run directory.
run_dir: runs/pilot
shuffle_seed: 20261016
n_shuffles: 5
prediction_seeds: [11, 22, 33]
expected_samples_per_seed: 5  # scheduling estimate, never an observed sample count
model:
  name: alphafold3
  version: unknown_pending_inference
  checkpoint: unknown_pending_inference
  msa: none
  templates: disabled
  # The publication's PDB snapshot is not an asserted training cutoff.
  documented_pdb_snapshot: '2023-01-12'
